<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>얌얌 식당! 매너왕을 찾아라!</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- Google MediaPipe Pose & Camera Utils -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <!-- Custom Style & Animations -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@700&display=swap');

        body {
            font-family: 'Jua', sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            overflow: hidden;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }

        .mirror-mode {
            transform: scaleX(-1);
        }

        /* Pulse Animation for Scores and Warning Badges */
        @keyframes pulse-bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }
        .animate-pulse-bounce {
            animation: pulse-bounce 0.8s infinite ease-in-out;
        }

        .food-card-selected {
            border-color: #38bdf8 !important;
            background-color: rgba(56, 189, 248, 0.25) !important;
            transform: scale(1.05);
        }
    </style>
</head>
<body class="w-screen h-screen relative bg-slate-900 overflow-hidden select-none">

    <!-- 1. Background Video (Webcam Feed) -->
    <video id="webcam-video" class="absolute inset-0 w-full h-full object-cover mirror-mode z-0" playsinline webkit-playsinline muted autoplay></video>

    <!-- 2. Skeleton Overlay Canvas -->
    <canvas id="skeleton-canvas" class="absolute inset-0 w-full h-full object-cover mirror-mode z-10 pointer-events-none"></canvas>

    <!-- 3. Three.js 3D Canvas (3D Food Render Engine) -->
    <canvas id="three-canvas" class="absolute inset-0 w-full h-full z-20 pointer-events-none"></canvas>

    <!-- 4. Top-Center Fluid Warning & Status Container -->
    <div id="top-center-alert-container" class="fixed inset-x-0 top-[clamp(4.2rem,8.5vh,6.5rem)] z-50 flex justify-center pointer-events-none px-4">
        
        <!-- Status Badge (Correct Posture) -->
        <div id="status-badge" class="hidden transition-all duration-300 bg-emerald-500/95 text-white px-5 py-2 md:px-6 md:py-2.5 rounded-full shadow-lg border-2 border-emerald-300 flex items-center gap-2 text-base md:text-xl font-bold animate-pulse-bounce">
            <span id="status-icon">🪑</span>
            <span id="status-text">잘했어요!</span>
        </div>

        <!-- Warning Alert (Compact Alert Popup) -->
        <div id="warning-alert" class="hidden transition-all duration-300 bg-rose-600/95 text-white px-4 py-2 md:px-5 md:py-2.5 rounded-full shadow-2xl border-2 border-rose-300 flex items-center gap-2 text-sm md:text-lg font-bold animate-pulse-bounce max-w-[90vw] sm:max-w-md text-center">
            <span id="warning-icon" class="text-lg md:text-xl">🚨</span>
            <span id="warning-text">돌아다니지 않아요!</span>
        </div>
    </div>

    <!-- 5. Main UI Overlay Screen Layer -->
    <div id="ui-layer" class="absolute inset-0 z-30 flex flex-col justify-between pointer-events-none p-4 md:p-6">

        <!-- Top Navigation / HUD Bar -->
        <header id="game-hud" class="w-full flex items-center justify-between pointer-events-auto hidden">
            <!-- Left: Manner Score Card -->
            <div class="bg-slate-900/85 backdrop-blur-md px-4 py-2 md:px-6 md:py-3 rounded-2xl border-2 border-amber-400 shadow-xl flex items-center gap-3">
                <span class="text-2xl md:text-3xl">⭐</span>
                <div>
                    <div class="text-xs text-amber-300 font-bold uppercase tracking-wider">매너 점수</div>
                    <div id="score-val" class="text-2xl md:text-4xl font-extrabold text-amber-400">20점</div>
                </div>
            </div>

            <!-- Right: Timer & Camera Flip Controls -->
            <div class="flex items-center gap-2 md:gap-3">
                <!-- Camera Switch Button -->
                <button id="btn-flip-cam" class="bg-slate-800/80 hover:bg-slate-700 text-white p-2.5 md:p-3 rounded-2xl border border-slate-600 shadow-lg transition active:scale-95" title="카메라 전환">
                    🔄
                </button>

                <!-- Timer Badge -->
                <div class="bg-slate-900/85 backdrop-blur-md px-4 py-2 md:px-6 md:py-3 rounded-2xl border-2 border-sky-400 shadow-xl flex items-center gap-3">
                    <span class="text-2xl md:text-3xl">⏰</span>
                    <div>
                        <div class="text-xs text-sky-300 font-bold uppercase tracking-wider">남은 시간</div>
                        <div id="timer-val" class="text-2xl md:text-4xl font-extrabold text-sky-300">20초</div>
                    </div>
                </div>
            </div>
        </header>

        <!-- Bottom Center: Food Cooking Progress Bar (Active Game Mode) -->
        <div id="food-progress-container" class="w-full max-w-md mx-auto mb-4 bg-slate-900/90 backdrop-blur-md p-4 rounded-3xl border-2 border-sky-400/50 shadow-2xl text-center pointer-events-auto hidden">
            <div id="food-label" class="text-lg md:text-xl text-sky-200 font-bold mb-2">🍕 음식을 만드는 중입니다...</div>
            <div class="w-full bg-slate-800 rounded-full h-5 border border-slate-700 overflow-hidden relative shadow-inner">
                <div id="progress-bar" class="bg-gradient-to-r from-amber-400 via-orange-500 to-emerald-400 h-full w-0% transition-all duration-300 rounded-full"></div>
            </div>
        </div>

        <!-- Practice Mode Back Navigation -->
        <div id="practice-hud" class="w-full flex justify-between items-center pointer-events-auto hidden">
            <div class="bg-slate-900/85 backdrop-blur-md px-4 py-2 rounded-2xl border border-emerald-400 text-emerald-300 font-bold text-base md:text-lg">
                🤸 자세 연습 모드 중
            </div>
            <button id="btn-exit-practice" class="bg-rose-600 hover:bg-rose-500 text-white px-5 py-2.5 rounded-2xl font-bold shadow-lg transition active:scale-95">
                🚪 나가기
            </button>
        </div>
    </div>

    <!-- 6. Modal Screens (Main, Food Selection, Game Results) -->

    <!-- Modal A: Main Screen -->
    <div id="screen-main" class="absolute inset-0 z-40 bg-slate-950/80 backdrop-blur-lg flex flex-col items-center justify-center p-6 text-center">
        <div class="max-w-lg w-full bg-slate-900/90 border-4 border-amber-400/80 rounded-3xl p-6 md:p-8 shadow-2xl space-y-6">
            <div class="text-5xl md:text-6xl animate-bounce">🍽️</div>
            <h1 class="text-3xl md:text-5xl font-black text-amber-300 tracking-tight leading-tight">
                얌얌 식당!<br><span class="text-white text-2xl md:text-4xl">매너왕을 찾아라!</span>
            </h1>
            <p class="text-slate-300 text-base md:text-lg leading-relaxed font-semibold">
                식당에서는 의자에 예쁘게 앉아서 음식을 기다려요!<br>
                바른 자세를 유지하면 맛있는 요리가 완성됩니다.
            </p>

            <div class="flex flex-col sm:flex-row gap-4 pt-2">
                <button id="btn-practice-mode" class="flex-1 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white text-xl font-bold py-4 rounded-2xl shadow-xl transition transform active:scale-95 border-2 border-emerald-300">
                    🤸 자세 연습하기
                </button>
                <button id="btn-start-select" class="flex-1 bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-400 hover:to-orange-500 text-white text-xl font-bold py-4 rounded-2xl shadow-xl transition transform active:scale-95 border-2 border-amber-300">
                    🎮 게임 시작하기
                </button>
            </div>
        </div>
    </div>

    <!-- Modal B: Food Selection Screen -->
    <div id="screen-select-food" class="absolute inset-0 z-40 bg-slate-950/85 backdrop-blur-lg flex flex-col items-center justify-center p-6 text-center hidden">
        <div class="max-w-2xl w-full bg-slate-900/90 border-4 border-sky-400/80 rounded-3xl p-6 md:p-8 shadow-2xl space-y-6">
            <h2 class="text-2xl md:text-4xl font-extrabold text-sky-300">어떤 음식을 만들건가요?</h2>
            <p class="text-slate-300 text-base md:text-lg">완성하고 싶은 메뉴를 하나 선택해 주세요!</p>

            <div class="grid grid-cols-3 gap-4 py-2">
                <!-- Food Item 0: Pizza -->
                <div class="food-card food-card-selected cursor-pointer bg-slate-800 border-2 border-slate-600 hover:border-sky-400 rounded-2xl p-4 transition transform flex flex-col items-center space-y-2" data-food-index="0">
                    <span class="text-4xl md:text-6xl">🍕</span>
                    <span class="text-lg md:text-xl font-bold text-amber-300">피자</span>
                </div>
                <!-- Food Item 1: Burger -->
                <div class="food-card cursor-pointer bg-slate-800 border-2 border-slate-600 hover:border-sky-400 rounded-2xl p-4 transition transform flex flex-col items-center space-y-2" data-food-index="1">
                    <span class="text-4xl md:text-6xl">🍔</span>
                    <span class="text-lg md:text-xl font-bold text-amber-300">치즈버거</span>
                </div>
                <!-- Food Item 2: Cake -->
                <div class="food-card cursor-pointer bg-slate-800 border-2 border-slate-600 hover:border-sky-400 rounded-2xl p-4 transition transform flex flex-col items-center space-y-2" data-food-index="2">
                    <span class="text-4xl md:text-6xl">🍰</span>
                    <span class="text-lg md:text-xl font-bold text-amber-300">생크림케이크</span>
                </div>
            </div>

            <div class="flex gap-4 pt-2">
                <button id="btn-back-main" class="w-1/3 bg-slate-700 hover:bg-slate-600 text-white text-lg font-bold py-3.5 rounded-2xl transition">
                    이전으로
                </button>
                <button id="btn-start-game" class="w-2/3 bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-400 hover:to-blue-500 text-white text-xl font-bold py-3.5 rounded-2xl shadow-xl transition transform active:scale-95 border-2 border-sky-300">
                    요리 시작하기! 🚀
                </button>
            </div>
        </div>
    </div>

    <!-- Modal C: Game Result Screen -->
    <div id="screen-result" class="absolute inset-0 z-40 bg-slate-950/90 backdrop-blur-xl flex flex-col items-center justify-center p-6 text-center hidden">
        <div class="max-w-lg w-full bg-slate-900/95 border-4 border-amber-400 rounded-3xl p-6 md:p-8 shadow-2xl space-y-6">
            <div class="text-6xl animate-bounce">🏆</div>
            <h2 class="text-3xl md:text-4xl font-extrabold text-amber-300">식사 예절 완수!</h2>
            <p class="text-xl md:text-2xl text-white font-bold">당신은 얌얌 식당의 <span class="text-amber-400">매너왕!</span></p>

            <div class="bg-slate-800/80 p-4 rounded-2xl border border-slate-700">
                <div class="text-sm text-slate-400 font-bold mb-1">최종 획득 점수</div>
                <div id="final-score" class="text-4xl md:text-5xl font-black text-amber-400">20점</div>
            </div>

            <button id="btn-restart-game" class="w-full bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white text-xl font-bold py-4 rounded-2xl shadow-xl transition transform active:scale-95 border-2 border-emerald-300">
                🔄 다시 하기
            </button>
        </div>
    </div>

    <!-- Application Script Implementation -->
    <script>
        /* -------------------------------------------------------------------------- */
        /*  1. Global State Management                                                */
        /* -------------------------------------------------------------------------- */
        const GameState = {
            MAIN: 'MAIN',
            PRACTICE: 'PRACTICE',
            SELECT_FOOD: 'SELECT_FOOD',
            PLAYING: 'PLAYING',
            RESULT: 'RESULT'
        };

        let currentState = GameState.MAIN;

        // Game Metrics & Timers
        let gameScore = 20;
        let gameTimeLeft = 20;
        let gameInterval = null;
        let selectedFoodIndex = 0; // 0: Pizza, 1: Burger, 2: Cake
        let foodProgress = 0; // 0 to 100%

        // Camera State
        let facingMode = 'user'; // 'user' or 'environment'
        let cameraUtils = null;

        // Posture States: 'SITTING', 'SITTING_ARM_MOVING', 'STANDING', 'LEG_RAISED', 'ABSENT'
        let currentPosture = 'ABSENT';
        let rawSittingStartTime = 0;
        let isSittingVerified = false;
        let sittingConsecutiveTicks = 0;

        // Cooldown and Energy Tracking
        let lastWarningTime = 0;
        const WARNING_COOLDOWN_MS = 5000;
        let prevKeypoints = null;
        let smoothedArmEnergy = 0;
        let smoothedTorsoEnergy = 0;

        /* -------------------------------------------------------------------------- */
        /*  2. Robust Web Audio Synthesizer & Universal TTS Engine                    */
        /* -------------------------------------------------------------------------- */
        let audioCtx = null;
        let bgmGainNode = null;
        let bgmInterval = null;
        let activeUtterance = null; // Protect from JS Garbage Collection

        function initAudioEngine() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function unlockAudioEngine() {
            initAudioEngine();
            // TTS Engine Warmup for Local Files
            if ('speechSynthesis' in window) {
                window.speechSynthesis.resume();
                window.speechSynthesis.getVoices();
            }
        }

        // Korean Speech TTS Function with Error Recovery
        function speakVoice(text) {
            if (!('speechSynthesis' in window)) return;

            unlockAudioEngine();

            setTimeout(() => {
                try {
                    window.speechSynthesis.cancel();

                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'ko-KR';
                    utterance.rate = 0.92;
                    utterance.pitch = 1.05;
                    utterance.volume = 1.0;

                    const voices = window.speechSynthesis.getVoices();
                    const krVoice = voices.find(v => v.lang.includes('ko') || v.lang.includes('KO'));
                    if (krVoice) utterance.voice = krVoice;

                    // Audio Ducking (Temporarily duck BGM during speech)
                    utterance.onstart = () => {
                        if (bgmGainNode && audioCtx) {
                            bgmGainNode.gain.setTargetAtTime(0.04, audioCtx.currentTime, 0.1);
                        }
                    };
                    utterance.onend = () => {
                        if (bgmGainNode && audioCtx) {
                            bgmGainNode.gain.setTargetAtTime(0.12, audioCtx.currentTime, 0.2);
                        }
                    };
                    utterance.onerror = () => {
                        if (bgmGainNode && audioCtx) {
                            bgmGainNode.gain.setTargetAtTime(0.12, audioCtx.currentTime, 0.2);
                        }
                    };

                    activeUtterance = utterance;
                    window.speechSynthesis.speak(utterance);
                } catch (e) {
                    console.warn("TTS Execution Error:", e);
                }
            }, 80);
        }

        const SoundEffects = {
            playScoreChime() {
                if (!audioCtx) return;
                const now = audioCtx.currentTime;
                const osc1 = audioCtx.createOscillator();
                const osc2 = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc1.type = 'sine';
                osc2.type = 'triangle';
                osc1.frequency.setValueAtTime(523.25, now); // C5
                osc1.frequency.exponentialRampToValueAtTime(1046.50, now + 0.3); // C6

                osc2.frequency.setValueAtTime(659.25, now); // E5
                osc2.frequency.exponentialRampToValueAtTime(1318.51, now + 0.3); // E6

                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

                osc1.connect(gain);
                osc2.connect(gain);
                gain.connect(audioCtx.destination);

                osc1.start(now);
                osc2.start(now);
                osc1.stop(now + 0.35);
                osc2.stop(now + 0.35);
            },

            playWarning() {
                if (!audioCtx) return;
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now); // A3
                osc.frequency.setValueAtTime(160, now + 0.12);

                gain.gain.setValueAtTime(0.18, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(now);
                osc.stop(now + 0.3);
            },

            playFanfare() {
                if (!audioCtx) return;
                const notes = [523.25, 659.25, 783.99, 1046.50]; // C E G C
                notes.forEach((freq, i) => {
                    const now = audioCtx.currentTime + (i * 0.12);
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();

                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now);

                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);

                    osc.start(now);
                    osc.stop(now + 0.4);
                });
            },

            startBGM() {
                initAudioEngine();
                if (bgmInterval) return;

                bgmGainNode = audioCtx.createGain();
                bgmGainNode.gain.setValueAtTime(0.12, audioCtx.currentTime);
                bgmGainNode.connect(audioCtx.destination);

                const melody = [261.63, 329.63, 392.00, 523.25, 392.00, 329.63];
                let step = 0;

                bgmInterval = setInterval(() => {
                    if (!audioCtx || audioCtx.state !== 'running') return;
                    const now = audioCtx.currentTime;
                    const osc = audioCtx.createOscillator();
                    const noteGain = audioCtx.createGain();

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(melody[step % melody.length], now);

                    noteGain.gain.setValueAtTime(0.15, now);
                    noteGain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);

                    osc.connect(noteGain);
                    noteGain.connect(bgmGainNode);

                    osc.start(now);
                    osc.stop(now + 0.25);
                    step++;
                }, 300);
            },

            stopBGM() {
                if (bgmInterval) {
                    clearInterval(bgmInterval);
                    bgmInterval = null;
                }
            }
        };

        /* -------------------------------------------------------------------------- */
        /*  3. Three.js Procedural Low-Poly 3D Food Generator                         */
        /* -------------------------------------------------------------------------- */
        let scene, camera, renderer, foodGroup;

        function initThree() {
            const canvas = document.getElementById('three-canvas');
            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 8);

            renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            // Lighting setup
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xfff5ea, 1.2);
            dirLight.position.set(5, 10, 7);
            scene.add(dirLight);

            foodGroup = new THREE.Group();
            scene.add(foodGroup);

            window.addEventListener('resize', onWindowResize);
            animateThree();
        }

        function onWindowResize() {
            if (!camera || !renderer) return;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animateThree() {
            requestAnimationFrame(animateThree);
            if (foodGroup) {
                foodGroup.rotation.y += 0.015;
            }
            if (renderer && scene && camera) {
                renderer.render(scene, camera);
            }
        }

        function clearFoodGroup() {
            while (foodGroup.children.length > 0) {
                const obj = foodGroup.children[0];
                foodGroup.remove(obj);
            }
        }

        function createFoodModel(typeIndex, scaleProgress = 1.0) {
            clearFoodGroup();

            const container = new THREE.Group();

            if (typeIndex === 0) {
                // Pizza
                const crustGeo = new THREE.CylinderGeometry(2, 2, 0.2, 12);
                const crustMat = new THREE.MeshLambertMaterial({ color: 0xe5a04d });
                const crust = new THREE.Mesh(crustGeo, crustMat);
                container.add(crust);

                const cheeseGeo = new THREE.CylinderGeometry(1.85, 1.85, 0.22, 12);
                const cheeseMat = new THREE.MeshLambertMaterial({ color: 0xf59e0b });
                const cheese = new THREE.Mesh(cheeseGeo, cheeseMat);
                container.add(cheese);

                // Pepperonis
                for (let i = 0; i < 6; i++) {
                    const pepGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.25, 8);
                    const pepMat = new THREE.MeshLambertMaterial({ color: 0xb91c1c });
                    const pep = new THREE.Mesh(pepGeo, pepMat);
                    const angle = (i / 6) * Math.PI * 2;
                    pep.position.set(Math.cos(angle) * 1.0, 0.05, Math.sin(angle) * 1.0);
                    container.add(pep);
                }
            } else if (typeIndex === 1) {
                // Burger
                const bunMat = new THREE.MeshLambertMaterial({ color: 0xd97706 });
                const pattyMat = new THREE.MeshLambertMaterial({ color: 0x451a03 });
                const cheeseMat = new THREE.MeshLambertMaterial({ color: 0xfacc15 });

                const bottomBun = new THREE.Mesh(new THREE.CylinderGeometry(1.6, 1.5, 0.4, 12), bunMat);
                bottomBun.position.y = -0.6;
                container.add(bottomBun);

                const patty = new THREE.Mesh(new THREE.CylinderGeometry(1.65, 1.65, 0.35, 12), pattyMat);
                patty.position.y = -0.2;
                container.add(patty);

                const cheese = new THREE.Mesh(new THREE.BoxGeometry(2.3, 0.08, 2.3), cheeseMat);
                cheese.position.y = 0.05;
                cheese.rotation.y = Math.PI / 4;
                container.add(cheese);

                const topBun = new THREE.Mesh(new THREE.SphereGeometry(1.6, 12, 8, 0, Math.PI * 2, 0, Math.PI / 2), bunMat);
                topBun.position.y = 0.1;
                container.add(topBun);
            } else {
                // Strawberry Cake
                const cakeMat = new THREE.MeshLambertMaterial({ color: 0xfff1f2 });
                const creamMat = new THREE.MeshLambertMaterial({ color: 0xfda4af });
                const berryMat = new THREE.MeshLambertMaterial({ color: 0xe11d48 });

                const baseCake = new THREE.Mesh(new THREE.CylinderGeometry(1.8, 1.8, 1.2, 12), cakeMat);
                baseCake.position.y = -0.3;
                container.add(baseCake);

                const creamLayer = new THREE.Mesh(new THREE.CylinderGeometry(1.82, 1.82, 0.2, 12), creamMat);
                creamLayer.position.y = 0.3;
                container.add(creamLayer);

                // Strawberries
                for (let i = 0; i < 5; i++) {
                    const berry = new THREE.Mesh(new THREE.ConeGeometry(0.25, 0.5, 8), berryMat);
                    const angle = (i / 5) * Math.PI * 2;
                    berry.position.set(Math.cos(angle) * 1.0, 0.65, Math.sin(angle) * 1.0);
                    container.add(berry);
                }
            }

            container.position.set(0, -1.0, 0);
            const s = Math.max(0.1, scaleProgress);
            container.scale.set(s, s, s);

            foodGroup.add(container);
        }

        /* -------------------------------------------------------------------------- */
        /*  4. MediaPipe Pose Analysis & Strict Posture Classification Engine         */
        /* -------------------------------------------------------------------------- */
        const POSE_LANDMARKS = {
            LEFT_SHOULDER: 11, RIGHT_SHOULDER: 12,
            LEFT_ELBOW: 13, RIGHT_ELBOW: 14,
            LEFT_WRIST: 15, RIGHT_WRIST: 16,
            LEFT_HIP: 23, RIGHT_HIP: 24,
            LEFT_KNEE: 25, RIGHT_KNEE: 26,
            LEFT_ANKLE: 27, RIGHT_ANKLE: 28
        };

        function classifyPosture(landmarks) {
            if (!landmarks) return 'ABSENT';

            const lSh = landmarks[POSE_LANDMARKS.LEFT_SHOULDER];
            const rSh = landmarks[POSE_LANDMARKS.RIGHT_SHOULDER];
            const lHip = landmarks[POSE_LANDMARKS.LEFT_HIP];
            const rHip = landmarks[POSE_LANDMARKS.RIGHT_HIP];
            const lKnee = landmarks[POSE_LANDMARKS.LEFT_KNEE];
            const rKnee = landmarks[POSE_LANDMARKS.RIGHT_KNEE];
            const lAnkle = landmarks[POSE_LANDMARKS.LEFT_ANKLE];
            const rAnkle = landmarks[POSE_LANDMARKS.RIGHT_ANKLE];

            // 1. Presence Validation
            const upperBodyVis = (lSh.visibility + rSh.visibility + lHip.visibility + rHip.visibility) / 4;
            if (upperBodyVis < 0.35) {
                return 'ABSENT';
            }

            const avgHipY = (lHip.y + rHip.y) / 2;
            const avgKneeY = (lKnee.y + rKnee.y) / 2;
            const avgAnkleY = (lAnkle.y + rAnkle.y) / 2;

            // 2. Leg Raised Check (Legs lifted above knee height / onto table)
            if (lAnkle.visibility > 0.4 && rAnkle.visibility > 0.4) {
                if (avgAnkleY < avgKneeY - 0.05) {
                    return 'LEG_RAISED';
                }
            }

            // 3. Torso / Body Wandering Movement Check
            const avgShoulderX = (lSh.x + rSh.x) / 2;
            const avgShoulderY = (lSh.y + rSh.y) / 2;
            const avgHipX = (lHip.x + rHip.x) / 2;

            let torsoVel = 0;
            if (prevKeypoints) {
                const dx = (avgShoulderX - prevKeypoints.shX) + (avgHipX - prevKeypoints.hipX);
                const dy = (avgShoulderY - prevKeypoints.shY) + (avgHipY - prevKeypoints.hipY);
                torsoVel = Math.sqrt(dx * dx + dy * dy);
            }

            // Sensitive Torso Movement Smoothing
            smoothedTorsoEnergy = smoothedTorsoEnergy * 0.6 + torsoVel * 0.4;

            // 4. Sitting vs Standing Height Ratio Validation
            // Sitting requirement: Hip and Knee must be nearly at the same horizontal level (|Hip Y - Knee Y| <= 0.18)
            const hipKneeDiff = Math.abs(avgHipY - avgKneeY);
            const isSittingElevation = (hipKneeDiff <= 0.18) || (avgHipY > 0.68);

            if (!isSittingElevation) {
                return 'STANDING';
            }

            // If torso is excessively moving or swaying while sitting
            if (smoothedTorsoEnergy > 0.04) {
                return 'STANDING'; // High priority wandering
            }

            // 5. Arm Motion Sensitivity Analysis
            const lWrist = landmarks[POSE_LANDMARKS.LEFT_WRIST];
            const rWrist = landmarks[POSE_LANDMARKS.RIGHT_WRIST];
            const lElbow = landmarks[POSE_LANDMARKS.LEFT_ELBOW];
            const rElbow = landmarks[POSE_LANDMARKS.RIGHT_ELBOW];

            let armVel = 0;
            if (prevKeypoints) {
                const dw1 = Math.hypot(lWrist.x - prevKeypoints.lWx, lWrist.y - prevKeypoints.lWy);
                const dw2 = Math.hypot(rWrist.x - prevKeypoints.rWx, rWrist.y - prevKeypoints.rWy);
                const de1 = Math.hypot(lElbow.x - prevKeypoints.lEx, lElbow.y - prevKeypoints.lEy);
                const de2 = Math.hypot(rElbow.x - prevKeypoints.rEx, rElbow.y - prevKeypoints.rEy);
                armVel = (dw1 + dw2 + de1 + de2) / 4;
            }

            smoothedArmEnergy = smoothedArmEnergy * 0.7 + armVel * 0.3;

            // Update keypoints cache
            prevKeypoints = {
                shX: avgShoulderX, shY: avgShoulderY,
                hipX: avgHipX, hipY: avgHipY,
                lWx: lWrist.x, lWy: lWrist.y,
                rWx: rWrist.x, rWy: rWrist.y,
                lEx: lElbow.x, lEy: lElbow.y
            };

            // Moderate Arm Movement Threshold (0.80)
            if (smoothedArmEnergy > 0.08) {
                return 'SITTING_ARM_MOVING';
            }

            return 'SITTING';
        }

        /* -------------------------------------------------------------------------- */
        /*  5. Canvas Skeleton Renderer                                               */
        /* -------------------------------------------------------------------------- */
        function drawSkeleton(ctx, landmarks, posture) {
            ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
            if (!landmarks) return;

            const isGood = (posture === 'SITTING');
            const lineColor = isGood ? '#a3e635' : '#f43f5e'; // Lime Green vs Rose Red
            const pointColor = isGood ? '#4ade80' : '#fb7185';

            const connections = [
                [11,12], [11,13], [13,15], [12,14], [14,16], // Upper body
                [11,23], [12,24], [23,24],                  // Torso
                [23,25], [24,26], [25,27], [26,28]           // Legs
            ];

            const w = ctx.canvas.width;
            const h = ctx.canvas.height;

            // Draw Bone Lines
            ctx.lineWidth = 6;
            ctx.strokeStyle = lineColor;
            ctx.shadowColor = lineColor;
            ctx.shadowBlur = 12;

            connections.forEach(([i, j]) => {
                const p1 = landmarks[i];
                const p2 = landmarks[j];
                if (p1 && p2 && p1.visibility > 0.3 && p2.visibility > 0.3) {
                    ctx.beginPath();
                    ctx.moveTo(p1.x * w, p1.y * h);
                    ctx.lineTo(p2.x * w, p2.y * h);
                    ctx.stroke();
                }
            });

            // Draw Joint Points
            ctx.fillStyle = pointColor;
            ctx.shadowBlur = 6;
            landmarks.forEach((p) => {
                if (p && p.visibility > 0.3) {
                    ctx.beginPath();
                    ctx.arc(p.x * w, p.y * h, 6, 0, 2 * Math.PI);
                    ctx.fill();
                }
            });
        }

        /* -------------------------------------------------------------------------- */
        /*  6. Core Game Loop & Posture Handling                                      */
        /* -------------------------------------------------------------------------- */
        function handlePostureFeedback(posture) {
            const warningAlert = document.getElementById('warning-alert');
            const warningIcon = document.getElementById('warning-icon');
            const warningText = document.getElementById('warning-text');

            const statusBadge = document.getElementById('status-badge');
            const statusIcon = document.getElementById('status-icon');
            const statusText = document.getElementById('status-text');

            const now = Date.now();

            if (posture === 'SITTING') {
                if (rawSittingStartTime === 0) rawSittingStartTime = now;

                // 1-Second Hold Verification
                if (now - rawSittingStartTime >= 1000) {
                    isSittingVerified = true;
                } else {
                    isSittingVerified = false;
                }
            } else {
                rawSittingStartTime = 0;
                isSittingVerified = false;
                sittingConsecutiveTicks = 0;
            }

            // A. Correct Posture ('SITTING' Verified >= 1s)
            if (isSittingVerified) {
                warningAlert.classList.add('hidden');

                if (currentState === GameState.PRACTICE) {
                    statusBadge.classList.remove('hidden');
                    statusIcon.innerText = '✨';
                    statusText.innerText = '참 잘했어요!';

                    if (now - lastWarningTime > 3000) {
                        lastWarningTime = now;
                        SoundEffects.playScoreChime();
                        speakVoice("참 잘했어요!");
                        confetti({ particleCount: 30, spread: 60, origin: { y: 0.8 } });
                    }
                } else if (currentState === GameState.PLAYING) {
                    statusBadge.classList.remove('hidden');
                    statusIcon.innerText = '🪑';
                    statusText.innerText = '잘했어요!';

                    // 3-second consecutive tick (30 frames) for +10 score
                    sittingConsecutiveTicks++;
                    foodProgress = Math.min(100, foodProgress + 0.3);

                    const progressBar = document.getElementById('progress-bar');
                    if (progressBar) progressBar.style.width = `${foodProgress}%`;

                    // Scale 3D Food as Progress fills
                    createFoodModel(selectedFoodIndex, 0.4 + (foodProgress / 100) * 0.8);

                    if (sittingConsecutiveTicks >= 90) { // 3 seconds at 30fps
                        sittingConsecutiveTicks = 0;
                        gameScore += 10;
                        updateHUD();
                        SoundEffects.playScoreChime();

                        const scoreVal = document.getElementById('score-val');
                        scoreVal.classList.add('animate-bounce');
                        setTimeout(() => scoreVal.classList.remove('animate-bounce'), 800);
                    }

                    if (foodProgress >= 100) {
                        foodProgress = 0;
                        SoundEffects.playFanfare();
                        confetti({ particleCount: 80, spread: 100, origin: { y: 0.5 } });
                    }
                }
                return;
            }

            // B. Unverified / In-Progress Sitting
            if (posture === 'SITTING' && !isSittingVerified) {
                warningAlert.classList.add('hidden');
                statusBadge.classList.remove('hidden');
                statusIcon.innerText = '⏳';
                statusText.innerText = '자세 유지 중...';
                return;
            }

            // C. Incorrect Postures (Wandering, Leg Raised, Arm Waving, Absent)
            statusBadge.classList.add('hidden');

            let msg = '';
            let icon = '🚨';

            // Priority Ordering: LEG_RAISED > STANDING > SITTING_ARM_MOVING > ABSENT
            if (posture === 'LEG_RAISED') {
                msg = '다리를 내리고 예쁘게 앉아요!';
                icon = '🦶';
            } else if (posture === 'STANDING' || posture === 'ABSENT') {
                msg = '돌아다니지 않아요!';
                icon = '🚨';
            } else if (posture === 'SITTING_ARM_MOVING') {
                msg = '팔을 제자리로 해요!';
                icon = '🖐️';
            }

            warningIcon.innerText = icon;
            warningText.innerText = msg;
            warningAlert.classList.remove('hidden');

            // Sound & Voice Trigger with 5-Second Cooldown
            if (now - lastWarningTime >= WARNING_COOLDOWN_MS) {
                lastWarningTime = now;
                SoundEffects.playWarning();
                speakVoice(msg);

                if (currentState === GameState.PLAYING) {
                    gameScore = Math.max(0, gameScore - 2);
                    updateHUD();
                }
            }
        }

        /* -------------------------------------------------------------------------- */
        /*  7. MediaPipe Pose Initialization & Camera Controller                     */
        /* -------------------------------------------------------------------------- */
        function onPoseResults(results) {
            const canvas = document.getElementById('skeleton-canvas');
            const ctx = canvas.getContext('2d');

            if (canvas.width !== window.innerWidth || canvas.height !== window.innerHeight) {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }

            currentPosture = classifyPosture(results.poseLandmarks);
            drawSkeleton(ctx, results.poseLandmarks, currentPosture);

            if (currentState === GameState.PLAYING || currentState === GameState.PRACTICE) {
                handlePostureFeedback(currentPosture);
            }
        }

        function initMediaPipe() {
            const pose = new Pose({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
            });

            pose.setOptions({
                modelComplexity: 0, // Lightweight Mobile/Tablet Optimization
                smoothLandmarks: true,
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });

            pose.onResults(onPoseResults);

            const videoElement = document.getElementById('webcam-video');

            cameraUtils = new Camera(videoElement, {
                onFrame: async () => {
                    await pose.send({ image: videoElement });
                },
                width: 1280,
                height: 720
            });

            cameraUtils.start();
        }

        /* -------------------------------------------------------------------------- */
        /*  8. State Transitions & UI Navigation                                       */
        /* -------------------------------------------------------------------------- */
        function updateHUD() {
            document.getElementById('score-val').innerText = `${gameScore}점`;
            document.getElementById('timer-val').innerText = `${gameTimeLeft}초`;
        }

        function switchState(newState) {
            currentState = newState;

            // Hide All Screens
            document.getElementById('screen-main').classList.add('hidden');
            document.getElementById('screen-select-food').classList.add('hidden');
            document.getElementById('screen-result').classList.add('hidden');

            document.getElementById('game-hud').classList.add('hidden');
            document.getElementById('practice-hud').classList.add('hidden');
            document.getElementById('food-progress-container').classList.add('hidden');

            document.getElementById('warning-alert').classList.add('hidden');
            document.getElementById('status-badge').classList.add('hidden');

            clearFoodGroup();

            if (newState === GameState.MAIN) {
                document.getElementById('screen-main').classList.remove('hidden');
                SoundEffects.stopBGM();
            } else if (newState === GameState.PRACTICE) {
                document.getElementById('practice-hud').classList.remove('hidden');
                SoundEffects.startBGM();
                speakVoice("자세 연습을 시작해요! 자리에 예쁘게 앉아볼까요?");
            } else if (newState === GameState.SELECT_FOOD) {
                document.getElementById('screen-select-food').classList.remove('hidden');
            } else if (newState === GameState.PLAYING) {
                document.getElementById('game-hud').classList.remove('hidden');
                document.getElementById('food-progress-container').classList.remove('hidden');

                gameScore = 20;
                gameTimeLeft = 20; // 20-second timer
                foodProgress = 0;
                sittingConsecutiveTicks = 0;
                updateHUD();

                createFoodModel(selectedFoodIndex, 0.4);
                SoundEffects.startBGM();

                // Start Game Timer Loop
                if (gameInterval) clearInterval(gameInterval);
                gameInterval = setInterval(() => {
                    gameTimeLeft--;
                    updateHUD();

                    if (gameTimeLeft <= 0) {
                        clearInterval(gameInterval);
                        gameInterval = null;
                        finishGame();
                    }
                }, 1000);
            } else if (newState === GameState.RESULT) {
                document.getElementById('screen-result').classList.remove('hidden');
                document.getElementById('final-score').innerText = `${gameScore}점`;
                SoundEffects.stopBGM();
                SoundEffects.playFanfare();
                confetti({ particleCount: 120, spread: 100, origin: { y: 0.4 } });
            }
        }

        function finishGame() {
            switchState(GameState.RESULT);
        }

        /* -------------------------------------------------------------------------- */
        /*  9. Event Listeners & Bootstrapping                                        */
        /* -------------------------------------------------------------------------- */
        document.addEventListener('DOMContentLoaded', () => {
            initThree();
            initMediaPipe();

            // Screen Buttons
            document.getElementById('btn-practice-mode').addEventListener('click', () => {
                unlockAudioEngine();
                switchState(GameState.PRACTICE);
            });

            document.getElementById('btn-start-select').addEventListener('click', () => {
                unlockAudioEngine();
                switchState(GameState.SELECT_FOOD);
            });

            document.getElementById('btn-back-main').addEventListener('click', () => {
                switchState(GameState.MAIN);
            });

            document.getElementById('btn-exit-practice').addEventListener('click', () => {
                switchState(GameState.MAIN);
            });

            document.getElementById('btn-start-game').addEventListener('click', () => {
                unlockAudioEngine();
                switchState(GameState.PLAYING);
            });

            document.getElementById('btn-restart-game').addEventListener('click', () => {
                switchState(GameState.MAIN);
            });

            // Food Card Selection Listener
            const foodCards = document.querySelectorAll('.food-card');
            foodCards.forEach(card => {
                card.addEventListener('click', () => {
                    foodCards.forEach(c => c.classList.remove('food-card-selected'));
                    card.classList.add('food-card-selected');
                    selectedFoodIndex = parseInt(card.getAttribute('data-food-index'), 10);
                });
            });

            // Flip Camera Toggle
            document.getElementById('btn-flip-cam').addEventListener('click', () => {
                facingMode = (facingMode === 'user') ? 'environment' : 'user';
                const videoEl = document.getElementById('webcam-video');
                const skeletonCanvas = document.getElementById('skeleton-canvas');

                if (facingMode === 'user') {
                    videoEl.classList.add('mirror-mode');
                    skeletonCanvas.classList.add('mirror-mode');
                } else {
                    videoEl.classList.remove('mirror-mode');
                    skeletonCanvas.classList.remove('mirror-mode');
                }

                if (cameraUtils) {
                    cameraUtils.stop();
                    cameraUtils = new Camera(videoEl, {
                        onFrame: async () => {
                            const pose = new Pose({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}` });
                            await pose.send({ image: videoEl });
                        },
                        facingMode: facingMode,
                        width: 1280,
                        height: 720
                    });
                    cameraUtils.start();
                }
            });

            // Global Touch Unlock for Audio & Speech Synthesis
            window.addEventListener('touchstart', unlockAudioEngine, { once: true });
            window.addEventListener('click', unlockAudioEngine, { once: true });
        });
    </script>
